name: Nessus Port Scan

on:
  push:               # Trigger on every push (i.e., commit) to any branch
    branches:
      - main          # Change this to your default branch if not 'main'
  schedule:           # Trigger every midnight
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  nessus_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget jq

      - name: Download and Install Nessus
        run: |
          wget https://www.tenable.com/downloads/api/v1/public/pages/nessus/downloads/13635/download?i_agree_to_tenable_license_agreement=true -O Nessus-10.2.0-ubuntu1110_amd64.deb
          sudo dpkg -i Nessus-10.2.0-ubuntu1110_amd64.deb

      - name: Start Nessus Service
        run: |
          sudo /bin/systemctl start nessusd.service
          sudo /bin/systemctl enable nessusd.service

      - name: Wait for Nessus to Initialize
        run: |
          until curl -k https://localhost:8834/server/status -o /dev/null; do
            echo "Waiting for Nessus to start..."
            sleep 10
          done
          echo "Nessus is up and running!"

      - name: Activate Nessus
        run: |
          curl -k -X POST https://localhost:8834/session \
          -H "Content-Type: application/json" \
          -d "{\"username\":\"admin\",\"password\":\"password\"}"
          curl -k -X POST https://localhost:8834/server/properties \
          -H "X-Cookie: token=your_token" \
          -d "{\"license\": {\"code\":\"YOUR_ACTIVATION_CODE\"}}"
        env:
          NESSUS_ACTIVATION_CODE: ${{ secrets.NESSUS_ACTIVATION_CODE }}

      - name: Create Nessus Scan Policy
        run: |
          curl -k -X POST https://localhost:8834/policies \
          -H "X-Cookie: token=your_token" \
          -d '{
                "settings": {
                  "name": "GitHub Actions Port Scan",
                  "text_targets": "http://altoro.testfire.net/",
                  "policy_id": 1,
                  "enabled": true
                }
              }'

      - name: Launch Nessus Scan
        run: |
          scan_id=$(curl -k -X POST https://localhost:8834/scans \
          -H "X-Cookie: token=your_token" \
          -d '{
                "uuid": "your_policy_uuid",
                "settings": {
                  "name": "Automated GitHub Actions Port Scan",
                  "policy_id": 1
                }
              }' | jq -r '.scan.id')
          curl -k -X POST https://localhost:8834/scans/${scan_id}/launch \
          -H "X-Cookie: token=your_token"

      - name: Monitor Nessus Scan Progress
        run: |
          status="running"
          while [ "$status" == "running" ] || [ "$status" == "pending" ]; do
            sleep 30
            status=$(curl -k -X GET https://localhost:8834/scans/${scan_id} \
            -H "X-Cookie: token=your_token" | jq -r '.info.status')
            echo "Current scan status: $status"
          done

      - name: Export and Upload Nessus Scan Report
        run: |
          file_id=$(curl -k -X POST https://localhost:8834/scans/${scan_id}/export \
          -H "X-Cookie: token=your_token" \
          -d '{
                "format": "html",
                "chapters": "vuln_hosts_summary"
              }' | jq -r '.file')
          curl -k -X GET https://localhost:8834/scans/${scan_id}/export/${file_id}/download \
          -H "X-Cookie: token=your_token" -o nessus_scan_report.html
          
          # Upload the report as an artifact
          uses: actions/upload-artifact@v3
          with:
            name: nessus-scan-report
            path: nessus_scan_report.html
