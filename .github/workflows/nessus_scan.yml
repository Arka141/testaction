name: Nessus Port Scan

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight UTC

jobs:
  nessus_scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Authenticate with Nessus API
        id: authenticate
        run: |
          response=$(curl -k -X POST "$NESSUS_HOST/session" \
          -H "Content-Type: application/json" \
          -d "{\"username\":\"$NESSUS_USERNAME\",\"password\":\"$NESSUS_PASSWORD\"}")
          token=$(echo $response | jq -r '.token')
          if [ "$token" == "null" ]; then
            echo "Failed to authenticate with Nessus API"
            exit 1
          fi
          echo "::set-output name=token::$token"
        env:
          NESSUS_HOST: ${{ secrets.NESSUS_HOST }}
          NESSUS_USERNAME: ${{ secrets.NESSUS_USERNAME }}
          NESSUS_PASSWORD: ${{ secrets.NESSUS_PASSWORD }}

      - name: Get Policy ID
        id: get_policy
        run: |
          policies=$(curl -k -X GET "$NESSUS_HOST/policies" \
          -H "X-Cookie: token=${{ steps.authenticate.outputs.token }}" \
          -H "Content-Type: application/json")
          policy_id=$(echo $policies | jq -r ".policies[] | select(.name==\"$SCAN_POLICY_NAME\") | .id")
          if [ -z "$policy_id" ]; then
            echo "Policy with name $SCAN_POLICY_NAME not found"
            exit 1
          fi
          echo "::set-output name=policy_id::$policy_id"
        env:
          NESSUS_HOST: ${{ secrets.NESSUS_HOST }}
          SCAN_POLICY_NAME: ${{ secrets.SCAN_POLICY_NAME }}

      - name: Create Scan
        id: create_scan
        run: |
          scan_data='{
            "uuid": "",
            "settings": {
              "name": "Automated Port Scan - $(date +%Y-%m-%d_%H-%M-%S)",
              "description": "Automated scan launched by GitHub Actions",
              "policy_id": '${{ steps.get_policy.outputs.policy_id }}',
              "text_targets": "'${{ secrets.SCAN_TARGET }}'"
            }
          }'
          response=$(curl -k -X POST "$NESSUS_HOST/scans" \
          -H "X-Cookie: token=${{ steps.authenticate.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d "$scan_data")
          scan_id=$(echo $response | jq -r '.scan.id')
          if [ -z "$scan_id" ]; then
            echo "Failed to create scan"
            exit 1
          fi
          echo "::set-output name=scan_id::$scan_id"
        env:
          NESSUS_HOST: ${{ secrets.NESSUS_HOST }}

      - name: Launch Scan
        run: |
          response=$(curl -k -X POST "$NESSUS_HOST/scans/${{ steps.create_scan.outputs.scan_id }}/launch" \
          -H "X-Cookie: token=${{ steps.authenticate.outputs.token }}" \
          -H "Content-Type: application/json")
          scan_uuid=$(echo $response | jq -r '.scan_uuid')
          if [ -z "$scan_uuid" ]; then
            echo "Failed to launch scan"
            exit 1
          fi
          echo "::set-output name=scan_uuid::$scan_uuid"

      - name: Monitor Scan Progress
        run: |
          status="running"
          while [ "$status" == "running" ] || [ "$status" == "pending" ]; do
            sleep 30
            response=$(curl -k -X GET "$NESSUS_HOST/scans/${{ steps.create_scan.outputs.scan_id }}" \
            -H "X-Cookie: token=${{ steps.authenticate.outputs.token }}" \
            -H "Content-Type: application/json")
            status=$(echo $response | jq -r '.info.status')
            echo "Current scan status: $status"
          done
          if [ "$status" != "completed" ]; then
            echo "Scan did not complete successfully"
            exit 1
          fi

      - name: Export Scan Report
        id: export_scan
        run: |
          export_data='{
            "format": "html",
            "chapters": "vuln_hosts_summary"
          }'
          response=$(curl -k -X POST "$NESSUS_HOST/scans/${{ steps.create_scan.outputs.scan_id }}/export" \
          -H "X-Cookie: token=${{ steps.authenticate.outputs.token }}" \
          -H "Content-Type: application/json" \
          -d "$export_data")
          file_id=$(echo $response | jq -r '.file')
          if [ -z "$file_id" ]; then
            echo "Failed to export scan report"
            exit 1
          fi
          echo "::set-output name=file_id::$file_id"

      - name: Download Scan Report
        run: |
          curl -k -X GET "$NESSUS_HOST/scans/${{ steps.create_scan.outputs.scan_id }}/export/${{ steps.export_scan.outputs.file_id }}/download" \
          -H "X-Cookie: token=${{ steps.authenticate.outputs.token }}" \
          -o nessus_report.html
        env:
          NESSUS_HOST: ${{ secrets.NESSUS_HOST }}

      - name: Upload Scan Report as Artifact
        uses: actions/upload-artifact@v3
        with:
          name: nessus-scan-report
          path: nessus_report.html
